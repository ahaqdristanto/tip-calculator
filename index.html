<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f3">
  <title>Tip calculator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173b32;
      --muted: #70827b;
      --green: #176b50;
      --mint: #d8eee3;
      --line: #e3eae5;
      --paper: #fff;
      --bg: #f3f6f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 12% 10%, #e4f0e7 0, transparent 32%),
        var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { width: min(100%, 940px); }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 22px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px;
      border-radius: 11px; background: var(--green); color: white; font-size: 18px;
    }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    .panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 28px;
      border: 1px solid #e8ede8;
      border-radius: 25px;
      background: var(--paper);
      box-shadow: 0 24px 70px #21433112, 0 3px 10px #21433108;
    }
    .inputs { padding: 8px 4px 6px; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 38px); letter-spacing: -.055em; line-height: 1.08; }
    .intro { margin: 10px 0 29px; color: var(--muted); font-size: 14px; }
    .field { margin-top: 22px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
    label, .field-label { font-size: 13px; font-weight: 700; }
    .hint { color: var(--muted); font-size: 12px; }
    .input-wrap { position: relative; }
    .currency {
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      color: #7d9087; font-weight: 650;
    }
    input {
      width: 100%; height: 49px; border: 1px solid var(--line); border-radius: 12px;
      background: #fbfcfb; color: var(--ink); font: inherit; font-size: 16px;
      font-weight: 650; outline: none; transition: border-color .16s, box-shadow .16s;
    }
    input:focus { border-color: #6aaa8c; box-shadow: 0 0 0 3px #176b5018; }
    #bill { padding: 0 14px 0 34px; text-align: right; }
    #people { padding: 0 14px; text-align: right; }
    .tip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .tip-btn {
      height: 43px; border: 1px solid transparent; border-radius: 10px;
      background: #f0f5f1; color: var(--ink); font: inherit; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: .16s ease;
    }
    .tip-btn:hover { background: #e5f0e8; }
    .tip-btn.active { background: var(--green); color: white; box-shadow: 0 4px 10px #176b5028; }
    #custom-tip { height: 43px; padding: 0 9px; text-align: center; font-size: 14px; }
    .result {
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 436px; padding: 27px; border-radius: 20px;
      background: var(--green); color: white;
    }
    .result-top { display: grid; gap: 25px; }
    .result-line { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .result-label { padding-top: 4px; font-size: 13px; font-weight: 700; }
    .result-label small { display: block; margin-top: 5px; color: #c5ddd2; font-size: 11px; font-weight: 500; }
    .amount { color: #a7e4c1; font-size: clamp(27px, 4vw, 38px); font-weight: 750; letter-spacing: -.055em; line-height: 1; white-space: nowrap; }
    .total-rule { height: 1px; background: #ffffff26; }
    .total .amount { color: white; }
    .result-bottom { margin-top: 35px; }
    .reset {
      width: 100%; height: 48px; border: 0; border-radius: 11px; background: #b5e6c9;
      color: #164532; font: inherit; font-size: 13px; font-weight: 800;
      letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: .16s ease;
    }
    .reset:hover { background: #d0f0dc; transform: translateY(-1px); }
    .footer { margin-top: 18px; text-align: center; color: #87968f; font-size: 11px; }
    @media (max-width: 680px) {
      body { padding: 20px 14px; place-items: start center; }
      .topline { margin-bottom: 17px; }
      .panel { grid-template-columns: 1fr; gap: 22px; padding: 21px; border-radius: 21px; }
      .inputs { padding: 3px 1px 0; }
      .intro { margin-bottom: 22px; }
      .field { margin-top: 19px; }
      .result { min-height: 260px; padding: 23px; }
      .result-top { gap: 20px; }
      .result-bottom { margin-top: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">%</span><span>good measure</span></div>
      <span class="eyebrow">Tip calculator</span>
    </header>
    <section class="panel" aria-label="Tip calculator">
      <div class="inputs">
        <h1>Split the bill.<br>Keep it easy.</h1>
        <p class="intro">A little math, a smoother checkout.</p>

        <div class="field">
          <div class="label-row"><label for="bill">Bill amount</label><span class="hint">Before tip</span></div>
          <div class="input-wrap"><span class="currency" aria-hidden="true">$</span><input id="bill" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="84.50"></div>
        </div>

        <div class="field">
          <div class="label-row"><span class="field-label">Choose your tip</span><span class="hint">Custom is fine too</span></div>
          <div class="tip-grid" role="group" aria-label="Tip percentage">
            <button class="tip-btn" type="button" data-tip="10" aria-pressed="false">10%</button>
            <button class="tip-btn active" type="button" data-tip="15" aria-pressed="true">15%</button>
            <button class="tip-btn" type="button" data-tip="18" aria-pressed="false">18%</button>
            <button class="tip-btn" type="button" data-tip="20" aria-pressed="false">20%</button>
            <button class="tip-btn" type="button" data-tip="25" aria-pressed="false">25%</button>
            <input id="custom-tip" type="number" min="0" max="100" step="1" inputmode="decimal" placeholder="Custom" aria-label="Custom tip percentage">
          </div>
        </div>

        <div class="field">
          <div class="label-row"><label for="people">Number of people</label><span class="hint">Including you</span></div>
          <input id="people" type="number" min="1" step="1" inputmode="numeric" value="2">
        </div>
      </div>

      <aside class="result" aria-live="polite" aria-label="Calculated amounts">
        <div class="result-top">
          <div class="result-line">
            <div class="result-label">Tip amount<small>per person</small></div>
            <output class="amount" id="tip-person">$0.00</output>
          </div>
          <div class="result-line">
            <div class="result-label">Total bill<small>including tip</small></div>
            <output class="amount" id="total-bill">$0.00</output>
          </div>
          <div class="total-rule"></div>
          <div class="result-line total">
            <div class="result-label">Each person pays<small>bill + tip, split evenly</small></div>
            <output class="amount" id="each-person">$0.00</output>
          </div>
        </div>
        <div class="result-bottom">
          <button class="reset" id="reset" type="button">Reset</button>
        </div>
      </aside>
    </section>
    <div class="footer">Good company. Fair split.</div>
  </main>
  <script>
    const billInput = document.querySelector('#bill');
    const peopleInput = document.querySelector('#people');
    const customInput = document.querySelector('#custom-tip');
    const tipButtons = [...document.querySelectorAll('.tip-btn')];
    let selectedTip = 15;

    const money = value => '$' + (Number.isFinite(value) ? Math.round((value + Number.EPSILON) * 100) / 100 : 0).toFixed(2);
    function calculate() {
      const bill = Math.max(0, Number(billInput.value) || 0);
      const people = Math.max(1, Math.floor(Number(peopleInput.value) || 1));
      const tipRate = customInput.value !== '' ? Math.max(0, Number(customInput.value) || 0) : selectedTip;
      const billCents = Math.round(bill * 100);
      const tipCents = Math.round(billCents * tipRate / 100);
      const totalCents = billCents + tipCents;
      document.querySelector('#tip-person').textContent = money(tipCents / 100 / people);
      document.querySelector('#total-bill').textContent = money(totalCents / 100);
      document.querySelector('#each-person').textContent = money(totalCents / 100 / people);
    }

    tipButtons.forEach(button => button.addEventListener('click', () => {
      selectedTip = Number(button.dataset.tip);
      customInput.value = '';
      tipButtons.forEach(item => {
        const active = item === button;
        item.classList.toggle('active', active);
        item.setAttribute('aria-pressed', String(active));
      });
      calculate();
    }));
    [billInput, peopleInput, customInput].forEach(input => input.addEventListener('input', () => {
      if (input === customInput && customInput.value !== '') {
        tipButtons.forEach(button => {
          button.classList.remove('active');
          button.setAttribute('aria-pressed', 'false');
        });
      }
      calculate();
    }));
    document.querySelector('#reset').addEventListener('click', () => {
      billInput.value = '';
      peopleInput.value = '1';
      customInput.value = '';
      selectedTip = 15;
      tipButtons.forEach(button => {
        const active = button.dataset.tip === '15';
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      calculate();
      billInput.focus();
    });
    calculate();
  </script>
</body>
</html>
